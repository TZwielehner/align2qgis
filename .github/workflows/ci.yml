name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff
      - name: Lint
        run: ruff check plugin tests tools

  test:
    name: pytest (PyQt6 smoke + pure-Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test deps
        # PyQt6 is what plugins.qgis.org will be running against once QGIS 4
        # lands; installing it explicitly here makes the PyQt6 smoke test run
        # in CI (it auto-skips locally).
        run: pip install pytest PyQt6
      - name: Run tests
        run: pytest tests/ -q

  bandit:
    name: bandit (security scan)
    # Mirrors what plugins.qgis.org runs on upload — failing this here
    # avoids the "my plugin got rejected at submission" surprise.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install bandit
        run: pip install bandit
      - name: Scan plugin source
        run: bandit -r plugin -ll

  package:
    name: build zip
    runs-on: ubuntu-latest
    needs: [lint, test, bandit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Package plugin
        run: python tools/package_plugin.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: align2qgis-plugin
          path: dist/align2qgis-*.zip
          if-no-files-found: error
